# Conductor workspace lifecycle for the Miragon Slidev deck template.
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "concurrent"

[scripts.run.example-deck]
command = "npm run dev"
default = true
icon = "play"

# Production build check: renders the deck (incl. the PDF) into ../dist.
[scripts.run.build]
command = "npm run build"
icon = "package"

# Run the full validator (source + rendered checks); boots Slidev + Chromium.
[scripts.run.verify]
command = "VERIFY_PORT=$CONDUCTOR_PORT npm run verify"
icon = "test-tube"

# Fast source-level guardrails (layout archetype + source checks); no dev server.
[scripts.run.verify-source]
command = "npm run verify:source"
icon = "shield-check"
