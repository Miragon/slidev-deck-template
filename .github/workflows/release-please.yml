name: Release

# On every push to main, release-please maintains a "Release PR" that bumps each
# package under kits/*/packages/* (and the Claude plugins) and updates their
# CHANGELOG.md. Merging that Release PR creates the GitHub releases/tags and
# triggers the npm publish job, once per released package.
#
# The GitHub App token (not the default GITHUB_TOKEN) is required so the bot's
# commits/tags trigger downstream workflows — a plain GITHUB_TOKEN would not.
#
# TEMPLATE-ONLY: this repo is a GitHub template, so "Use this template" copies
# this workflow into every new deck repo. The App credentials live at ORG level
# in Miragon, so a copy would happily open Release PRs there and then fail the
# npm publish (the OIDC repo claim no longer matches the trusted publisher).
# Every job is therefore guarded by `github.repository == '<this repo>'`; in a
# derived repo the run shows up as skipped and does nothing. The guard is a
# literal string per job on purpose — the `env` context is not available in
# `jobs.<id>.if`. If this repo is ever renamed or moved, update all of them.
#
# npm publish uses Trusted Publishing (OIDC). npm's registry validates the OIDC
# token against the trusted-publisher config on npmjs.com, and EVERY claim must
# match or the token exchange fails with a misleading `E404` ("package not
# found") — see npm/cli#8678, #9088. Two things the config must agree with:
#   1. Workflow filename = release-please.yml. The publish therefore runs INLINE
#      here (NOT a reusable workflow), so the OIDC workflow ref resolves to this
#      file and not to a callee.
#   2. NO GitHub environment. The trusted-publisher "Environment name" field is
#      empty, so this job must NOT declare `environment:` — an environment claim
#      the config doesn't expect makes the exchange 404. Keep them in sync: to
#      re-add an environment, set the same name in the npm config first.
#
# BETA: a manual run with `beta_package` + `beta_version` publishes ONE package
# from the SELECTED BRANCH (e.g. 0.4.0-beta.0) under the `beta` dist-tag, so a
# change can be tried in a real deck before it is released. The version is set
# in the runner only: nothing is committed, tagged or released, `latest` does
# not move, and release-please keeps counting from the last stable version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate packaging/publish without releasing'
        type: boolean
        default: false
      publish_current:
        description: 'Publish the current package versions now (idempotent recovery lever; all packages)'
        type: boolean
        default: false
      beta_package:
        description: 'Publish a beta of this package (<kit>/<package>) from the selected branch (dist-tag beta)'
        type: choice
        default: none
        options:
          - none
          - slidev/toolkit
          - slidev/speaker-profiles
          - slidev/validator
          - slidev/create-deck
          - hub/hub-template
      beta_version:
        description: 'The beta version to publish, e.g. 0.4.0-beta.0'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Skip cleanly until the GitHub App is configured, so a push to main does not
    # fail the workflow before the credentials exist.
    if: >-
      github.repository == 'Miragon/brand-toolbox' &&
      (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && inputs.beta_package == 'none')) &&
      vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The npm packages to publish: the released ones, or all of them on a
      # `publish_current` dispatch. Paths outside kits/*/packages/* (the Claude
      # plugins) are released by release-please but never published to npm.
      - id: packages
        env:
          PATHS_RELEASED: ${{ steps.release_please.outputs.paths_released }}
          PUBLISH_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_current }}
        run: node shared/scripts/npm-packages.mjs >> "$GITHUB_OUTPUT"

  # Inline publish (see the note at the top of this file — must NOT be a reusable
  # workflow, so the OIDC token resolves to release-please.yml for npm Trusted
  # Publishing). One matrix entry per package to publish. Idempotent: skips a
  # package whose current version is already on the registry.
  publish:
    needs: release-please
    if: >-
      github.repository == 'Miragon/brand-toolbox' &&
      !cancelled() && needs.release-please.result == 'success' &&
      needs.release-please.outputs.packages != '[]' && needs.release-please.outputs.packages != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    name: publish ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1, newer than what Node 24
      # ships. Upgrade the CLI before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: shared/scripts/publish-if-new.sh "${{ matrix.package }}"

  # Manual beta of ONE package from the selected branch (see the note at the top
  # of this file). Inline for the same OIDC reason as the publish job above.
  # With dry_run = true it rehearses the publish instead.
  publish-beta:
    if: >-
      github.repository == 'Miragon/brand-toolbox' &&
      github.event_name == 'workflow_dispatch' && inputs.beta_package != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BETA_PACKAGE: ${{ inputs.beta_package }}
      BETA_VERSION: ${{ inputs.beta_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Refuse a version that is not a beta
        run: |
          if ! [[ "$BETA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::'$BETA_VERSION' is not a beta version, expected e.g. 0.4.0-beta.0"
            exit 1
          fi
      - name: Publish the beta
        run: |
          package_dir="kits/${BETA_PACKAGE%%/*}/packages/${BETA_PACKAGE#*/}"
          npm pkg set version="$BETA_VERSION" -w "$package_dir"
          npm publish -w "$package_dir" --provenance --access public --tag beta ${{ inputs.dry_run && '--dry-run' || '' }}

  # Manual sanity check: `Run workflow` with dry_run = true builds and runs
  # `npm publish --dry-run` for every package without releasing anything.
  dry-run:
    if: >-
      github.repository == 'Miragon/brand-toolbox' &&
      github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.beta_package == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Dry-run every package
        run: |
          for package_dir in $(node -e 'import("./shared/scripts/npm-packages.mjs").then(m => console.log(m.allNpmPackageDirs().join(" ")))'); do
            npm publish -w "$package_dir" --access public --dry-run
          done
