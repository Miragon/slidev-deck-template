name: CI

# The repository's own CI: builds the reference deck, runs its guardrails and
# checks that every package has the same release setup. The deck CI that new
# decks get lives in kits/slidev/.github/workflows/ci.yml (create-slidev-deck
# copies it); GitHub never runs that copy here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Every package has the same release setup
        run: npm run check:release

      # The speaker profiles address slides by the `id:` in their frontmatter.
      # `npm run dev` stamps a new slide automatically, so this only fails when
      # someone commits without ever having started the dev server - and then it
      # fails here rather than silently shifting somebody's selection.
      - name: Verify every slide of the reference deck has a stable id
        run: npm run check:ids

      - name: Build the reference deck
        run: npx slidev build kits/slidev/deck/slides.md --base /${{ github.event.repository.name }}/ --out ../dist

      - name: Verify guardrails (layout + source checks)
        run: npm run verify:source
