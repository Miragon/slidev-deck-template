# Dependabot configuration for the Miragon Slidev deck template.
#
# Goal: minimal PR noise. Every ecosystem gets one bundled PR for its minor
# and patch updates, which dependabot-automerge.yml merges once CI is green,
# and one bundled PR for its majors, which stays manual.
#   - npm            : bundled PRs every Monday.
#   - github-actions : bundled PRs every month.
#
# Security updates are grouped the same way and arrive on CVE publication,
# independent of the schedule below.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ─── npm: Slidev, Vue, theme, playwright-chromium, addons ──────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      # Minors and patches together: the PR that auto-merges.
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors apart, so a breaking bump never holds the others back.
      npm-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      # Same bundling for security fixes.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ─── GitHub Actions used in .github/workflows/ ─────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Minors and patches together: the PR that auto-merges.
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors apart, so a breaking bump never holds the others back.
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
